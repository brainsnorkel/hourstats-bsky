app = "hourstats-prod"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 15
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "UTC"
  DATA_DIR = "/data"
  HOURSTATS_PROFILE = "prod"
  DRY_RUN = "false"
  ANALYSIS_INTERVAL_MINUTES = "60"
  ANALYSIS_OFFSET_MINUTES = "55"
  TRENDING_ENABLED = "true"
  GEMINI_MODEL = "gemini-3.8-flash"
  GROUP_FALLBACK_MODEL = "gemini-3.5-flash-lite"
  S3_BACKUP_BUCKET = "hourstats-sqlite-backups"
  S3_BACKUP_REGION = "us-west-2"
  BACKUP_RETAIN_DAYS = "7"
  GOMEMLIMIT = "1200MiB"
  GOGC = "75"
  SQLITE_MMAP_MB = "0"
  SQLITE_READ_CONNS = "3"
  HEALTH_CHART_MEMORY_LIMIT_MB = "2048"
  ALERT_DISCORD_MENTION = "@here"
  # 2026-11-04 election-week volume (hs-thk): hours of ~260k English posts exceed the
  # ~150k hydration ceiling. Lift the window cap off the live volume and give
  # hydration 25 minutes. Since hs-thk.4 a truncated hydration is no longer a loss
  # (never-attempted posts are scored), so HYDRATION_MAX_ERROR_PCT keeps its default.
  # The cap stays explicit at 350000, above the 312,500 ceiling; ALERT_CYCLE_SECONDS
  # is left unset and derives from the timeout (25 min + 10 min cycle reserve = 2100 s, hs-047).
  ANALYSIS_MAX_WINDOW_POSTS = "350000"
  HYDRATION_TIMEOUT_MINUTES = "25"

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = 2048
