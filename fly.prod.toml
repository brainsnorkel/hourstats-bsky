app = "hourstats-prod"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "UTC"
  DATA_DIR = "/data"
  HOURSTATS_PROFILE = "prod"
  DRY_RUN = "true"
  ANALYSIS_INTERVAL_MINUTES = "30"
  TRENDING_ENABLED = "true"
  TRENDING_INTERVAL = "15"
  TRENDING_POST_HOURS = "6"
  S3_BACKUP_BUCKET = "hourstats-sqlite-backups"
  S3_BACKUP_REGION = "us-west-2"
  BACKUP_RETAIN_DAYS = "7"

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = 512
