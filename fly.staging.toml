app = "hourstats-staging"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "UTC"
  DATA_DIR = "/data"
  HOURSTATS_PROFILE = "staging"
  DRY_RUN = "false"
  ANALYSIS_INTERVAL_MINUTES = "60"
  ANALYSIS_OFFSET_MINUTES = "55"
  TRENDING_ENABLED = "true"
  S3_BACKUP_BUCKET = "hourstats-sqlite-backups"
  S3_BACKUP_REGION = "us-west-2"
  BACKUP_RETAIN_DAYS = "7"
  GOMEMLIMIT = "400MiB"
  GOGC = "75"

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = 512
