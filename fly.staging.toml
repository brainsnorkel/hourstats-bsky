app = "hourstats-staging"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 15
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "UTC"
  DATA_DIR = "/data"
  HOURSTATS_PROFILE = "staging"
  DRY_RUN = "false"
  ANALYSIS_INTERVAL_MINUTES = "60"
  ANALYSIS_OFFSET_MINUTES = "25"
  TRENDING_ENABLED = "true"
  S3_BACKUP_BUCKET = "hourstats-sqlite-backups"
  S3_BACKUP_REGION = "us-west-2"
  BACKUP_RETAIN_DAYS = "7"
  GOMEMLIMIT = "800MiB"
  GOGC = "75"
  SQLITE_MMAP_MB = "0"
  SQLITE_READ_CONNS = "3"
  HEALTH_CHART_MEMORY_LIMIT_MB = "1024"
  # hs-019.1: the per-DID create cap, set explicitly to document the default
  FIREHOSE_MAX_POSTS_PER_DID_PER_MINUTE = "60"
  # every snapshot trips stale_posts (staging drops hundreds of thousands of
  # backfill creates a window), which is the point: it proves the alert path
  # end to end — the `alert` log line, the one-per-hour suppression, and
  # /stats/health reporting status=warn — without waiting for a real fault.

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = 1024
